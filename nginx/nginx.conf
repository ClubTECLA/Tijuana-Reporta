events {}

http {
    # Sin esto nginx solo conoce unos pocos tipos (entre ellos image/jpeg) y sirve
    # un .mp4 como text/plain; con nosniff, el navegador no lo reproduce.
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name _;

        # Subida de fotos y videos: único endpoint con body grande. El resto de /api/
        # conserva el límite por defecto de 1 MB. 12m deja margen sobre el
        # video (8 MiB) más el multipart.
        location ~ ^/api/v1/reportes/[^/]+/multimedia$ {
            client_max_body_size 12m;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        # Fotos y videos guardados por el servicio multimedia. Los nombres son aleatorios y
        # nunca se reutilizan, así que el contenido de una URL no cambia.
        location /multimedia/ {
            alias /data/uploads/;
            autoindex off;
            # No sigue symlinks: aunque alguien plante uno en el volumen, no sirve archivos de fuera.
            disable_symlinks on;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://frontend-web:80/;
            proxy_set_header Host $host;
        }
    }
}
