package: api
generate:
  models: true
  gin-server: true
  strict-server: true
  embedded-spec: true
output: internal/api/generated.go
output-options:
  # Un solo tipo UUID en todo el stack. Por defecto oapi-codegen usa
  # openapi_types.UUID; lo mapeamos al mismo google/uuid que genera sqlc para
  # las columnas uuid, así no hay conversiones entre la capa HTTP y la de datos.
  # pgx/v5 sabe leer y escribir uuid.UUID de forma nativa.
  type-mapping:
    string:
      formats:
        uuid:
          type: uuid.UUID

# type-mapping solo define el nombre del tipo, no de dónde viene: sin esto
# el generador deduce el import como "uuid" y el archivo no compila.
additional-imports:
  - alias: uuid
    package: github.com/google/uuid

# enable-auth-scopes-on-context: sin esto oapi-codegen no genera las
# constantes *Scopes ni el c.Set(...) por operación que el middleware de
# auth necesita para saber si una ruta requiere autenticación. Es una
# compatibilidad "legacy" (oapi-codegen recomienda en su lugar un
# middleware de validación de requests contra el spec), pero como solo
# tenemos un esquema de seguridad simple (bearer, sin scopes reales) nos
# alcanza y es mucho más simple.
compatibility:
  enable-auth-scopes-on-context: true
