version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "internal/database/migrations"
    gen:
      go:
        package: "db"
        out: "internal/database/db"
        emit_json_tags: true
        emit_interface: true
        # El proyecto usa pgx/v5, no database/sql.
        sql_package: "pgx/v5"
        overrides:
          # Mismo tipo UUID que genera oapi-codegen para la capa HTTP
          # (ver openapi-codegen-config.yaml), para no convertir en cada borde.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Lo mismo con las fechas: el contrato OpenAPI usa time.Time para
          # date-time, así que evitamos pgtype.Timestamptz en los modelos.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
