version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/queries"
    schema: "internal/database/migrations"
    gen:
      go:
        package: "domain"
        out: "internal/domain"
        emit_json_tags: true
        emit_interface: true
        # El proyecto usa pgx/v5, no database/sql.
        sql_package: "pgx/v5"
        overrides:
          # Mismo tipo UUID que genera oapi-codegen para la capa HTTP
          # (ver openapi-codegen-config.yaml), para no convertir en cada borde.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Lo mismo con las fechas: el contrato OpenAPI usa time.Time para
          # date-time, así que evitamos pgtype.Timestamptz en los modelos.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # Las columnas opcionales se mapean a punteros en vez de pgtype.Text:
          # el handler distingue "sin valor" con un nil check (ver toUsuario),
          # no con un campo .Valid.
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            go_type: "int"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int"
              pointer: true
          # Las PK SERIAL son un tipo aparte para sqlc, no int4.
          - db_type: "serial"
            go_type: "int"
