version: "2"
sql:
  - engine: "postgresql"
    # Cada funcionalidad guarda sus consultas junto a su código; todas se
    # generan en el mismo paquete internal/db/sqlc. El nombre del .sql da el
    # del archivo generado, así que no se repite entre funcionalidades.
    queries:
      - "internal/queries"
      - "internal/historial/historial.sql"
      - "internal/reporte/reporte.sql"
      - "internal/incidente/incidente.sql"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        emit_json_tags: true
        emit_interface: true
        # El proyecto usa pgx/v5, no database/sql.
        sql_package: "pgx/v5"
        # sqlc singulariza "multimedia" como si fuera plural en inglés y
        # generaría "Multimedium"; el contrato y el resto del código usan Multimedia.
        rename:
          multimedium: "Multimedia"
        overrides:
          # Mismo tipo UUID que genera oapi-codegen para la capa HTTP
          # (ver openapi-codegen-config.yaml), para no convertir en cada borde.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Lo mismo con las fechas: el contrato OpenAPI usa time.Time para
          # date-time, así que evitamos pgtype.Timestamptz en los modelos.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # Las columnas opcionales se mapean a punteros en vez de pgtype.Text:
          # el handler distingue "sin valor" con un nil check (ver toUsuario),
          # no con un campo .Valid.
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.int4"
            go_type: "int"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int"
              pointer: true
          # Las PK SERIAL son un tipo aparte para sqlc, no int4.
          - db_type: "serial"
            go_type: "int"
          - db_type: "float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          # Las columnas DOUBLE PRECISION llegan como pg_catalog.float8;
          # el override de arriba solo cubre los casts ::float8 de las consultas.
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          # SMALLINT (int2) también se mapea a int, para no cargar con
          # pgtype.Int2 en la capa de servicio. pgx convierte entre int2 e
          # int al leer y al escribir (y falla si el valor no cabe en int2).
          - db_type: "pg_catalog.int2"
            go_type: "int"
          - db_type: "pg_catalog.int2"
            nullable: true
            go_type:
              type: "int"
              pointer: true
