version: '3'

vars:
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://user:pass@localhost:5432/db?sslmode=disable"}}'

tasks:
  run:
    desc: Levanta la API
    cmds:
      - go run ./cmd/api

  generate:
    desc: Genera código a partir de OpenAPI y SQL
    cmds:
      # oapi-codegen está fijado como tool dependency en go.mod, así que sale
      # con la versión correcta desde un clone limpio, sin instalarlo aparte.
      - go tool oapi-codegen -config openapi-codegen-config.yaml ../shared/openapi/openapi.yaml
      - sqlc generate

  generate-check:
    desc: Falla si el código generado no está al día con el contrato
    cmds:
      - task: generate
      - git diff --exit-code -- internal/api/generated.go internal/database/db

  migrate-up:
    desc: Aplica migraciones pendientes
    cmds:
      - migrate -path internal/database/migrations -database "{{.DATABASE_URL}}" up

  migrate-down:
    desc: Revierte la última migración
    cmds:
      - migrate -path internal/database/migrations -database "{{.DATABASE_URL}}" down 1

  test:
    desc: Corre los tests
    cmds:
      - go test ./... -v