openapi: 3.0.3
info:
  title: Tijuana Reporta API
  version: 1.0.0
  description: |
    Las rutas con candado requieren autenticación: haz `POST /auth/login` y pega el `access_token` en **Authorize**.

    Esta página se genera del contrato (`shared/openapi`): para que aparezca una ruta nueva, agrégala ahí y corre `task generate` en `backend/`.

security:
  - bearerAuth: []

paths:
  /reportes:
    $ref: './paths/reportes.yaml#/crearReporte'
  /reportes/cercanos:
    $ref: './paths/reportes.yaml#/listarReportesCercanos'
  /reportes/{reporteId}:
    $ref: './paths/reportes.yaml#/obtenerReporte'
  /reportes/{reporteId}/avistamientos:
    $ref: './paths/reportes.yaml#/agregarAvistamiento'
  /reportes/{reporteId}/comentarios:
    $ref: './paths/comentarios.yaml#/crearComentario'
  /reportes/{reporteId}/multimedia:
    $ref: './paths/multimedia.yaml#/subirMultimedia'
  /reportes/{reporteId}/estado:
    $ref: './paths/reportes.yaml#/cambiarEstadoReporte'
  /auth/register:
    $ref: './paths/auth.yaml#/register'
  /auth/login:
    $ref: './paths/auth.yaml#/login'
  /auth/me:
    $ref: './paths/auth.yaml#/me'
  /auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /incidentes:
    $ref: './paths/incidentes.yaml#/crearIncidente'
  /incidentes/{incidenteId}:
    $ref: './paths/incidentes.yaml#/obtenerIncidente'
  /incidentes/{incidenteId}/tags:
    $ref: './paths/incidentes.yaml#/agregarTags'
  /users:
    $ref: './paths/usuarios.yaml#/listarUsuarios'

components:
  schemas:
    Comentario:
      $ref: './schemas/comentarios/comentario.yaml'
    CrearComentarioRequest:
      $ref: './schemas/comentarios/crear_comentario_request.yaml'
    Reporte:
      $ref: './schemas/reportes/reporte.yaml'
    ReporteResumen:
      $ref: './schemas/reportes/reporte_resumen.yaml'
    ReporteCercano:
      $ref: './schemas/reportes/reporte_cercano.yaml'
    CambiarEstadoReporteRequest:
      $ref: './schemas/reportes/cambiar_estado_reporte_request.yaml'
    EstadoReporte:
      $ref: './schemas/reportes/estado_reporte.yaml'
    TituloReporte:
      $ref: './schemas/reportes/titulo_reporte.yaml'
    Multimedia:
      $ref: './schemas/multimedia/multimedia.yaml'
    SubirMultimediaRequest:
      $ref: './schemas/multimedia/subir_multimedia_request.yaml'
    Tag:
      $ref: './schemas/tags/tag.yaml'
    TagCatalogo:
      $ref: './schemas/tags/tag_catalogo.yaml'
    CrearTagRequest:
      $ref: './schemas/tags/crear_tag_request.yaml'
    Location:
      $ref: './schemas/locations/location.yaml'
    CrearReporteRequest:
      $ref: './schemas/reportes/crear_reporte_request.yaml'
    ErrorResponse:
      $ref: './schemas/error_response.yaml'
    RegisterRequest:
      $ref: './schemas/auth/register_request.yaml'
    LoginRequest:
      $ref: './schemas/auth/login_request.yaml'
    AuthResponse:
      $ref: './schemas/auth/auth_response.yaml'
    Usuario:
      $ref: './schemas/auth/usuario.yaml'
    UsuarioMeResponse:
      $ref: './schemas/auth/usuario_me_response.yaml'
    Incidente:
      $ref: './schemas/incidentes/incidente.yaml'
    CrearIncidenteRequest:
      $ref: './schemas/incidentes/crear_incidente_request.yaml'
    UsuarioResumen:
      $ref: './schemas/users/usuario_resumen.yaml'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT