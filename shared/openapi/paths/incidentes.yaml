crearIncidente:
  get:
    operationId: listarIncidentes
    description: Lista los tipos de incidente y las etiquetas de su catálogo, ordenados por nombre. Por defecto incluye solo los activos; use incluir_inactivos para incluir los demás.
    tags: [Incidentes]
    parameters:
      - name: incluir_inactivos
        in: query
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Lista de incidentes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Incidente'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  post:
    operationId: crearIncidente
    description: Crea un tipo de incidente con su configuración y etiquetas iniciales. Solo los administradores pueden crear tipos de incidente.
    tags: [Incidentes]
    security:
      - bearerAuth: [admin]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CrearIncidenteRequest'
    responses:
      '201':
        description: Incidente creado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incidente'
      '400':
        description: Datos inválidos (p. ej. color mal formado o tags repetidos)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: El usuario no tiene rol de administrador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: Ya existe un incidente con ese nombre
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      
      '500':
        description: Usuario no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

obtenerIncidente:
  get:
    operationId: obtenerIncidente
    description: Devuelve un tipo de incidente y las etiquetas de su catálogo por ID, esté activo o no.
    tags: [Incidentes]
    parameters:
      - name: incidenteId
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Incidente encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incidente'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Incidente no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  put:
    operationId: actualizarIncidente
    description: Actualiza la configuración de un tipo de incidente existente. Solo los administradores pueden modificarlo.
    tags: [Incidentes]
    security:
      - bearerAuth: [admin]
    parameters:
      - name: incidenteId
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActualizarIncidenteRequest'
    responses:
      '200':
        description: Incidente actualizado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Incidente'
      '400':
        description: Datos inválidos (p. ej. color mal formado)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: El usuario no tiene rol de administrador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Incidente no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: Ya existe otro incidente con ese nombre
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

agregarTags:
  post:
    operationId: agregarTags
    description: Agrega etiquetas al catálogo de un tipo de incidente existente. Solo los administradores pueden modificar el catálogo.
    tags: [Incidentes]
    security:
      - bearerAuth: [admin]
    parameters:
      - name: incidenteId
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              $ref: '#/components/schemas/CrearTagRequest'
    responses:
      '201':
        description: Tags creados, en el orden en que se mandaron
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TagCatalogo'
      '400':
        description: Datos inválidos (p. ej. tags repetidos en la petición)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: El usuario no tiene rol de administrador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Incidente no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El incidente ya tiene un tag con ese nombre (sin importar mayúsculas)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Usuario no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Incidente:
      $ref: '../schemas/incidentes/incidente.yaml'
    CrearIncidenteRequest:
      $ref: '../schemas/incidentes/crear_incidente_request.yaml'
    CrearTagRequest:
      $ref: '../schemas/tags/crear_tag_request.yaml'
    ActualizarIncidenteRequest:
      $ref: '../schemas/incidentes/actualizar_incidente_request.yaml'
    TagCatalogo:
      $ref: '../schemas/tags/tag_catalogo.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
