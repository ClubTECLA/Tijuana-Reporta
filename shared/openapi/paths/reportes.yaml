crearReporte:
  get:
    operationId: listarReportes
    description: Lista los reportes activos para mostrarlos en el mapa. Puede limitar los resultados al área visible enviando sus coordenadas mínimas y máximas.
    tags: [Reportes]
    parameters:
      - name: min_lat
        in: query
        schema: { type: number, format: double, minimum: -90, maximum: 90 }
      - name: max_lat
        in: query
        schema: { type: number, format: double, minimum: -90, maximum: 90 }
      - name: min_lng
        in: query
        schema: { type: number, format: double, minimum: -180, maximum: 180 }
      - name: max_lng
        in: query
        schema: { type: number, format: double, minimum: -180, maximum: 180 }
    responses:
      '200':
        description: Lista de reportes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReporteResumen'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  post:
    operationId: crearReporte
    description: Crea un reporte con su tipo de incidente y ubicación. La foto se adjunta después en la ruta de multimedia; solo los roles distintos de ciudadano pueden marcarlo como oficial.
    tags: [Reportes]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CrearReporteRequest'
    responses:
      '201':
        description: Reporte creado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Un ciudadano no puede crear reportes oficiales
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

obtenerReporte:
  get:
    operationId: obtenerReporte
    description: Devuelve el detalle de un reporte identificado por su UUID.
    tags: [Reportes]
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Reporte encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      
      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  delete:
    operationId: eliminarReporte
    description: >-
      Elimina el reporte y sus datos asociados, incluidos comentarios,
      multimedia, etiquetas y ubicaciones. Los usuarios ciudadanos no pueden
      eliminar reportes; los demás roles pueden hacerlo aunque no sean sus
      creadores.
    tags: [Reportes]
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Reporte eliminado
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: El usuario no es el creador del reporte y es ciudadano
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

agregarAvistamiento:
  patch:
    operationId: agregarAvistamiento
    description: Registra un avistamiento adicional para el reporte y devuelve el reporte actualizado.
    tags: [Reportes]
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Avistamiento agregado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      
      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

cambiarEstadoReporte:
  patch:
    operationId: cambiarEstadoReporte
    description: >-
      Cambia el estado del reporte. Solo pueden hacerlo los roles distintos de
      ciudadano. Los estados avanzan de Pendiente a Probable, Verificado y
      Resuelto (se pueden saltar pasos); Descartado puede alcanzarse desde un
      estado no final. Resuelto y Descartado son finales. Los cambios que no
      respetan estas transiciones responden 409.
    tags: [Reportes]
    security:
    - bearerAuth: []
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CambiarEstadoReporteRequest'
    responses:
      '200':
        description: Estado del reporte cambiado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      
      '403':
        description: El usuario es ciudadano
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El reporte no puede pasar de su estado actual al pedido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Usuario no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

actualizarTagsReporte:
  put:
    operationId: actualizarTagsReporte
    description: >-
      Actualiza las etiquetas confirmadas por el usuario autenticado en el
      reporte. La lista enviada reemplaza las etiquetas anteriores; una lista
      vacía las elimina. Los conteos y el puntaje se recalculan automáticamente.
      La operación es idempotente y cada etiqueta debe pertenecer al tipo de
      incidente del reporte; si no, responde 400.
    tags: [Reportes]
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActualizarTagsReporteRequest'
    responses:
      '200':
        description: Tags actualizados; devuelve el reporte con los conteos nuevos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      '400':
        description: Datos inválidos (p. ej. un tag que no es del incidente del reporte)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

listarReportesCercanos:
  get:
    operationId: listarReportesCercanos
    description: Lista los reportes activos dentro del radio indicado alrededor de un punto, ordenados del más cercano al más lejano. Puede filtrar por tipo de incidente, estado y fecha.
    tags: [Reportes]
    # ?lat=..&lng=..&radio=..&incidente_id=1&incidente_id=4&estado=Verificado
    parameters:
      - { name: lat,   in: query, required: true, schema: { type: number, format: double, minimum: -90,  maximum: 90 } }
      - { name: lng,   in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      - { name: radio, in: query, required: true, schema: { type: number, format: double, minimum: 1, maximum: 50000 } }
      - { name: incidente_id, in: query, required: false, style: form, explode: true,
        schema: { type: array, items: { type: integer } } }
      - { name: estado, in: query, required: false, style: form, explode: true,
        schema: { type: array, items: { $ref: '#/components/schemas/EstadoReporte' } } }
      - { name: desde,  in: query, required: false, schema: { type: string, format: date-time } }
      - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
    responses:
      '200':
        description: Lista de reportes cercanos
        content: 
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReporteCercano'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

listarMisReportes:
  get:
    operationId: listarMisReportes
    description: Lista todos los reportes creados por el usuario autenticado, de cualquier estado, del más reciente al más antiguo.
    tags: [Reportes]
    parameters:
      - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
    responses:
      '200':
        description: Lista de mis reportes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReporteResumen'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Reporte:
      $ref: '../schemas/reportes/reporte.yaml'
    CambiarEstadoReporteRequest:
      $ref: '../schemas/reportes/cambiar_estado_reporte_request.yaml'
    ActualizarTagsReporteRequest:
      $ref: '../schemas/reportes/actualizar_tags_reporte_request.yaml'
    ReporteResumen:
      $ref: '../schemas/reportes/reporte_resumen.yaml'
    CrearReporteRequest:
      $ref: '../schemas/reportes/crear_reporte_request.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
    EstadoReporte:
      $ref: '../schemas/reportes/estado_reporte.yaml'
    ReporteCercano:
      $ref: '../schemas/reportes/reporte_cercano.yaml'
