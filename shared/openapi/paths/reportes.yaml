crearReporte:
  get:
    operationId: listarReportes
    description: Reportes activos para el mapa. Si se manda el área visible, filtra por ella.
    parameters:
      - name: min_lat
        in: query
        schema: { type: number, format: double, minimum: -90, maximum: 90 }
      - name: max_lat
        in: query
        schema: { type: number, format: double, minimum: -90, maximum: 90 }
      - name: min_lng
        in: query
        schema: { type: number, format: double, minimum: -180, maximum: 180 }
      - name: max_lng
        in: query
        schema: { type: number, format: double, minimum: -180, maximum: 180 }
    responses:
      '200':
        description: Lista de reportes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReporteResumen'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  post:
    operationId: crearReporte
    description: "Crea un reporte en la ubicación indicada. La foto se sube después con `subirMultimedia`. Solo los roles distintos de ciudadano pueden mandar `es_oficial: true` (403 si no)."
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CrearReporteRequest'
    responses:
      '201':
        description: Reporte creado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Un ciudadano no puede crear reportes oficiales
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

obtenerReporte:
  get:
    operationId: obtenerReporte
    description: "Devuelve un reporte por su id. 404 si no existe."
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Reporte encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      
      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

agregarAvistamiento:
  patch:
    operationId: agregarAvistamiento
    description: "Suma un avistamiento (alguien más vio el mismo problema) al reporte y devuelve el reporte actualizado."
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Avistamiento agregado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      
      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

cambiarEstadoReporte:
  patch:
    operationId: cambiarEstadoReporte
    description: >-
      Lo puede usar cualquier rol menos ciudadano. Se valida en el servicio (y no
      con scopes) para que un rol nuevo quede permitido sin tocar el contrato.
      Los estados solo avanzan (Pendiente → Probable → Verificado → Resuelto,
      pudiendo saltar pasos) y Descartado se alcanza desde cualquier estado no
      final. Resuelto y Descartado son finales; cualquier otro cambio es 409.
    security:
    - bearerAuth: []
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CambiarEstadoReporteRequest'
    responses:
      '200':
        description: Estado del reporte cambiado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reporte'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      
      '403':
        description: El usuario es ciudadano
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

      '404':
        description: Reporte no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El reporte no puede pasar de su estado actual al pedido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '500':
        description: Usuario no encontrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

listarReportesCercanos:
  get:
    operationId: listarReportesCercanos
    description: Reportes activos dentro de un radio (metros) alrededor de un punto, del más cercano al más lejano.
    # ?lat=..&lng=..&radio=..&incidente_id=1&incidente_id=4&estado=Verificado
    parameters:
      - { name: lat,   in: query, required: true, schema: { type: number, format: double, minimum: -90,  maximum: 90 } }
      - { name: lng,   in: query, required: true, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      - { name: radio, in: query, required: true, schema: { type: number, format: double, minimum: 1, maximum: 50000 } }
      - { name: incidente_id, in: query, required: false, style: form, explode: true,
        schema: { type: array, items: { type: integer } } }
      - { name: estado, in: query, required: false, style: form, explode: true,
        schema: { type: array, items: { $ref: '#/components/schemas/EstadoReporte' } } }
      - { name: desde,  in: query, required: false, schema: { type: string, format: date-time } }
      - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
    responses:
      '200':
        description: Lista de reportes cercanos
        content: 
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReporteCercano'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

listarMisReportes:
  get:
    operationId: listarMisReportes
    description: Reportes creados por el usuario autenticado (todos los estados), del más reciente al más antiguo.
    parameters:
      - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
    responses:
      '200':
        description: Lista de mis reportes
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReporteResumen'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Reporte:
      $ref: '../schemas/reportes/reporte.yaml'
    CambiarEstadoReporteRequest:
      $ref: '../schemas/reportes/cambiar_estado_reporte_request.yaml'
    ReporteResumen:
      $ref: '../schemas/reportes/reporte_resumen.yaml'
    CrearReporteRequest:
      $ref: '../schemas/reportes/crear_reporte_request.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
    EstadoReporte:
      $ref: '../schemas/reportes/estado_reporte.yaml'
    ReporteCercano:
      $ref: '../schemas/reportes/reporte_cercano.yaml'
