coleccionUsuarios:
  get:
    operationId: listarUsuarios
    description: Lista los usuarios del sistema con su rol y resumen de reportes. Solo los administradores pueden consultar esta lista.
    tags: [Usuarios]
    security:
      - bearerAuth: [admin]
    responses:
      '200':
        description: Lista de usuarios
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UsuarioResumen'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: El usuario no tiene rol de administrador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

coleccionRoles:
  get:
    operationId: listarRoles
    description: Lista los roles disponibles en el sistema. Solo los administradores pueden consultar el catálogo.
    tags: [Roles]
    security:
      - bearerAuth: [admin]
    responses:
      '200':
        description: Catálogo de roles
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Rol'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: El usuario no tiene rol de administrador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Rol:
      $ref: '../schemas/roles/rol.yaml'
    UsuarioResumen:
      $ref: '../schemas/users/usuario_resumen.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
