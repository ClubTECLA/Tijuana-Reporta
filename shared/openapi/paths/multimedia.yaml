subirMultimedia:
  post:
    operationId: subirMultimedia
    description: >
      Sube la foto o el video del reporte. Solo lo puede subir su creador, y un
      solo archivo (foto o video, no los dos) por usuario por reporte. La foto
      debe ser un JPEG ya reducido por la app. El video debe ser un MP4 (H.264)
      ya comprimido por la app, de unos 5 segundos (por defecto el servidor acepta
      hasta 6; el despliegue puede cambiarlo con MAX_VIDEO_SEGUNDOS); los .mov de
      QuickTime se rechazan. El backend detecta el tipo por el contenido, no por
      el nombre ni el Content-Type, valida el tamaño y las dimensiones de la foto
      o la duración del video, y le quita los metadatos: el EXIF de la foto y, en
      el video, los del contenedor (las cajas udta, meta y uuid). No analiza los
      datos del video, así que la información que el códec lleve dentro de sus
      muestras (por ejemplo mensajes SEI de H.264) se conserva. El servicio
      multimedia lo guarda; el path de la respuesta se sirve en /multimedia/{path}
      y termina en .jpg o .mp4.
    tags: [Multimedia]
    parameters:
      - name: reporteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/SubirMultimediaRequest'
    responses:
      '201':
        description: Foto o video guardado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Multimedia'
      '400':
        description: Archivo faltante, multipart inválido o formato no soportado (solo JPEG o MP4)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Reporte no encontrado, o el usuario no es su creador
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El usuario ya subió un archivo a este reporte
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '413':
        description: El archivo es demasiado grande para su tipo (la foto, 3 MiB; el video, 8 MiB por defecto)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: La imagen excede las dimensiones permitidas, o el video dura más de lo permitido
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '503':
        description: El servicio de almacenamiento no está disponible; se puede reintentar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Multimedia:
      $ref: '../schemas/multimedia/multimedia.yaml'
    SubirMultimediaRequest:
      $ref: '../schemas/multimedia/subir_multimedia_request.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
