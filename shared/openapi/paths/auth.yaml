register:
  post:
    operationId: register
    description: Registra una cuenta con correo electrónico y contraseña y devuelve los datos de sesión junto con un token de acceso. La contraseña debe tener entre 8 y 72 bytes. Responde 409 si el correo ya está registrado.
    tags: [Autenticación]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    responses:
      '201':
        description: Usuario creado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El email ya está registrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

login:
  post:
    operationId: login
    description: Inicia sesión con correo electrónico y contraseña y devuelve un token de acceso para autenticar las demás rutas.
    tags: [Autenticación]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      '200':
        description: Login exitoso
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Credenciales inválidas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

me:
  get:
    operationId: me
    description: Devuelve los datos de la cuenta asociada al token de acceso y el nombre de su rol.
    tags: [Autenticación]
    responses:
      '200':
        description: Usuario autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioMeResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

logout:
  post:
    operationId: logout
    description: Confirma el cierre de sesión. Como el servidor no conserva los tokens, el cliente debe descartar el token de acceso.
    tags: [Autenticación]
    security: []
    responses:
      '204':
        description: Sesión cerrada

recovery:
  post:
    operationId: solicitarRecuperacion
    security: []
    summary: Solicitud de recuperación de contraseña
    description: Envía un correo electrónico con un código de verificación para recuperar la contraseña del usuario.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/recovery_request.yaml'
    responses:
      '202':
        description: Correo de recuperación aceptado.
      '400':
        description: Solicitud inválida.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: Demasiadas solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

verifyRecovery:
  post:
    operationId: verificarRecuperacion
    security: []
    summary: Verificación de recuperación de contraseña
    description: Verifica el código de recuperación y permite al usuario establecer una nueva contraseña.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/verify_recovery_request.yaml'
    responses:
      '204':
        description: Contraseña cambiada exitosamente. Sin contenido.
      '400':
        description: Solicitud inválida o código de verificación incorrecto.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: Demasiadas solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RegisterRequest:
      $ref: '../schemas/auth/register_request.yaml'
    LoginRequest:
      $ref: '../schemas/auth/login_request.yaml'
    AuthResponse:
      $ref: '../schemas/auth/auth_response.yaml'
    Usuario:
      $ref: '../schemas/auth/usuario.yaml'
    UsuarioMeResponse:
      $ref: '../schemas/auth/usuario_me_response.yaml'
    RecoveryRequest:
      $ref: '../schemas/auth/recovery_request.yaml'
    VerifyRecoveryRequest:
      $ref: '../schemas/auth/verify_recovery_request.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
