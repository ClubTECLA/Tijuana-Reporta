register:
  post:
    operationId: register
    description: "Crea una cuenta con email y contraseña (8 a 72 bytes) y devuelve un token de acceso. 409 si el email ya está registrado."
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    responses:
      '201':
        description: Usuario creado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El email ya está registrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

login:
  post:
    operationId: login
    description: "Valida email y contraseña y devuelve un token de acceso. Usa ese token como `Authorization: Bearer <token>` en el resto de rutas."
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      '200':
        description: Login exitoso
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Credenciales inválidas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

me:
  get:
    operationId: me
    description: "Devuelve el usuario dueño del token, con el nombre de su rol."
    responses:
      '200':
        description: Usuario autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioMeResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

logout:
  post:
    operationId: logout
    description: "Cierra la sesión. El token no se guarda en el servidor, así que solo responde 204; el cliente debe descartarlo."
    security: []
    responses:
      '204':
        description: Sesión cerrada

components:
  schemas:
    RegisterRequest:
      $ref: '../schemas/auth/register_request.yaml'
    LoginRequest:
      $ref: '../schemas/auth/login_request.yaml'
    AuthResponse:
      $ref: '../schemas/auth/auth_response.yaml'
    Usuario:
      $ref: '../schemas/auth/usuario.yaml'
    UsuarioMeResponse:
      $ref: '../schemas/auth/usuario_me_response.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
