register:
  post:
    operationId: registrarUsuario
    description: "Crea una cuenta con email y contraseña (8 a 72 bytes) y devuelve un token de acceso. 409 si el email ya está registrado."
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    responses:
      '201':
        description: Usuario creado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: El email ya está registrado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

login:
  post:
    operationId: inicioDeSesion
    description: "Valida email y contraseña y devuelve un token de acceso. Usa ese token como `Authorization: Bearer <token>` en el resto de rutas."
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      '200':
        description: Login exitoso
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        description: Datos inválidos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Credenciales inválidas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

me:
  get:
    operationId: me
    description: "Devuelve el usuario dueño del token, con el nombre de su rol."
    responses:
      '200':
        description: Usuario autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioMeResponse'
      '401':
        description: No autenticado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

logout:
  post:
    operationId: cerrarSesion
    description: "Cierra la sesión. El token no se guarda en el servidor, así que solo responde 204; el cliente debe descartarlo."
    security: []
    responses:
      '204':
        description: Sesión cerrada

recovery:
  post:
    operationId: solicitarRecuperacion
    security: []
    summary: Solicitud de recuperación de contraseña
    description: Envía un correo electrónico con un código de verificación para recuperar la contraseña del usuario.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/recovery_request.yaml'
    responses:
      '202':
        description: Correo de recuperación aceptado.
      '400':
        description: Solicitud inválida.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: Demasiadas solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

verifyRecovery:
  post:
    operationId: verificarRecuperacion
    security: []
    summary: Verificación de recuperación de contraseña
    description: Verifica el código de recuperación y permite al usuario establecer una nueva contraseña.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/auth/verify_recovery_request.yaml'
    responses:
      '204':
        description: Contraseña cambiada exitosamente. Sin contenido.
      '400':
        description: Solicitud inválida o código de verificación incorrecto.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429':
        description: Demasiadas solicitudes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RegisterRequest:
      $ref: '../schemas/auth/register_request.yaml'
    LoginRequest:
      $ref: '../schemas/auth/login_request.yaml'
    AuthResponse:
      $ref: '../schemas/auth/auth_response.yaml'
    Usuario:
      $ref: '../schemas/auth/usuario.yaml'
    UsuarioMeResponse:
      $ref: '../schemas/auth/usuario_me_response.yaml'
    RecoveryRequest:
      $ref: '../schemas/auth/recovery_request.yaml'
    VerifyRecoveryRequest:
      $ref: '../schemas/auth/verify_recovery_request.yaml'
    ErrorResponse:
      $ref: '../schemas/error_response.yaml'
