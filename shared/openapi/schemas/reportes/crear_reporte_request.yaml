type: object
required: [incidente_id, latitude, longitude]
properties:
  incidente_id:
    type: integer
  latitude:
    type: number
    format: double
    minimum: -90
    maximum: 90
  longitude:
    type: number
    format: double
    minimum: -180
    maximum: 180
  es_oficial:
    type: boolean
    default: false
  direccion:
    type: string
    maxLength: 255
