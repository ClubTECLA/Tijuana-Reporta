type: object
required: [incidente_id, latitude, longitude]
properties:
  incidente_id:
    type: integer
  latitude:
    type: number
    format: double
    minimum: -90
    maximum: 90
  longitude:
    type: number
    format: double
    minimum: -180
    maximum: 180
  multimedia:
    $ref: '../../openapi.yaml#/components/schemas/CrearMultimediaRequest'
  es_oficial:
    type: boolean
    default: false