type: object
description: Detalle completo de un reporte.
required:
  - id
  - incidente_id
  - avistamientos
  - es_historico
  - es_oficial
  - estado_actual
  - latitude
  - longitude
  - created_at
  - updated_at
  - comentarios
  - fotos
  - tags
  - locations
properties:
  id:
    type: string
    format: uuid
  incidente_id:
    type: integer
  avistamientos:
    type: integer
  es_historico:
    type: boolean
  es_oficial:
    type: boolean
  estado_actual:
    $ref: '../../openapi.yaml#/components/schemas/EstadoReporte'
  latitude:
    type: number
    format: double
    description: Centroide de todas las locations (tabla puntos_origen).
  longitude:
    type: number
    format: double
    description: Centroide de todas las locations (tabla puntos_origen).
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  expired_at:
    type: string
    format: date-time
  comentarios:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/Comentario'
  fotos:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/Foto'
  tags:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/Tag'
  locations:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/Location'
