type: object
description: Versión ligera de un reporte para pintar pines en el mapa.
required: [id, incidente_id, estado_actual, avistamientos, es_oficial, latitude, longitude]
properties:
  id:
    type: string
    format: uuid
  incidente_id:
    type: integer
  estado_actual:
    $ref: '../../openapi.yaml#/components/schemas/EstadoReporte'
  avistamientos:
    type: integer
  es_oficial:
    type: boolean
  latitude:
    type: number
    format: double
    description: Centroide del reporte (tabla puntos_origen).
  longitude:
    type: number
    format: double
    description: Centroide del reporte (tabla puntos_origen).
