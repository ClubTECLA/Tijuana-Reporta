type: object
description: Un usuario del sistema.
required:
  - id
  - username
  - email
  - rol_name
  - reportes_count
properties:
  id:
    type: string
    format: uuid
  username:
    type: string
  email:
    type: string
    format: email
    nullable: true
  rol_name:
    type: string
  reportes_count:
    type: integer
