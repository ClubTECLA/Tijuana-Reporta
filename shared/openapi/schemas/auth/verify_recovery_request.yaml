type: object
description: Solicitud para verificar y recuperar la contraseña de un usuario.
required: [email, pin, new_password]
properties:
  email:
    type: string
    format: email
  pin:
    type: string
    pattern: '^[0-9]{6}$'
    description: Código de verificación enviado al correo del usuario.
  new_password:
    $ref: './password.yaml'